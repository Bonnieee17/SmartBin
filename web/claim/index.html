<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBin - Claim Portal</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Full Background Logo */
        .background-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            opacity: 0.08;
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: rgba(245, 249, 245, 0.95);
            text-align: center;
        }

        .logo-main {
            width: 100px;
            height: 100px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        h1 {
            color: #2e7d32;
            font-size: 26px;
            margin: 0 0 10px 0;
            font-weight: 800;
        }

        .desc {
            color: #555;
            max-width: 320px;
            line-height: 1.5;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .install-box {
            background: white;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.15);
            border: 1px solid rgba(46, 125, 50, 0.1);
            width: 100%;
            max-width: 340px;
        }

        .btn-install {
            display: block;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 17px;
            letter-spacing: 0.5px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
        }

        .btn-install:active {
            transform: scale(0.98);
        }

        #open-step {
            display: none;
            margin-top: 25px;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-open {
            display: block;
            color: #2e7d32;
            text-decoration: none;
            padding: 14px;
            font-weight: 700;
            font-size: 15px;
            border: 2px solid #2e7d32;
            border-radius: 14px;
            background: #fff;
        }

        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(46,125,50,0.2);
        }
    </style>
</head>
<body>

    <img src="/favicon.png" class="background-logo" alt="">

    <div class="container">
        <img src="/favicon.png" class="logo-main" alt="SmartBin">

        <div id="type-badge" class="badge">DISPOSAL DETECTED</div>

        <h1 id="title">Install SmartBin</h1>
        <p id="description" class="desc"><b>Install This App for a Better Experience.</b><br>Scan successful! You must use the official app to complete this action and update your rewards.</p>

        <div class="install-box">
            <a href="/app-release.apk" class="btn-install" id="download-btn">1. INSTALL APP</a>

            <div id="open-step">
                <div style="font-size: 12px; color: #666; margin-bottom: 15px;">✓ Download Started!</div>
                <a id="open-link" href="#" class="btn-open">2. OPEN APP & CLAIM</a>
            </div>
        </div>

        <div style="margin-top: 40px; font-size: 10px; color: #bbb; font-weight: 600; letter-spacing: 1px;">
            SMARTBIN ECO-SYSTEM v2.0
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        // Detection Logic
        const voucher = params.get('voucher');
        const cost = params.get('cost');
        const type = params.get('type');
        const pts = params.get('pts');
        const bin = params.get('bin');

        const badge = document.getElementById('type-badge');
        const title = document.getElementById('title');
        const description = document.getElementById('description');
        const openLink = document.getElementById('open-link');
        const downloadBtn = document.getElementById('download-btn');
        const openStep = document.getElementById('open-step');

        let appLink = "";

        if (voucher) {
            // VOUCHER UI
            badge.innerText = "VOUCHER AVAILABLE";
            badge.style.background = "#fff3e0";
            badge.style.color = "#ef6c00";
            title.innerText = "Redeem Voucher";
            description.innerText = `You are about to redeem "${voucher}" for ${cost} Eco Points. Please open the app to confirm.`;
            appLink = `smartbin://claim?voucher=${encodeURIComponent(voucher)}&cost=${cost}`;
        } else {
            // DISPOSAL UI
            badge.innerText = "DISPOSAL DETECTED";
            title.innerText = "Claim Points";
            const itemType = type || "Item";
            const itemPts = pts || "0";
            description.innerText = `Successfully scanned ${itemType} disposal. You are eligible for ${itemPts} points!`;
            appLink = `smartbin://claim?type=${encodeURIComponent(itemType)}&pts=${itemPts}&bin=${bin || 'BIN-001'}`;
        }

        openLink.href = appLink;

        downloadBtn.addEventListener('click', () => {
            downloadBtn.innerText = "DOWNLOADING...";
            setTimeout(() => {
                openStep.style.display = "block";
            }, 800);
        });

        // Prevent PWA installation prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
