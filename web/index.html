<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmartBin Reward System">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SmartBin</title>
  <style>
    body {
      background-color: #f0f4f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #loading {
      text-align: center;
      transition: opacity 0.3s ease-out;
    }
    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="favicon.png" style="width: 100px; height: 100px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px;">
    <div style="color: #2e7d32; font-family: sans-serif; font-weight: bold; letter-spacing: 2px;">SMARTBIN LOADING...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function(ev) {
      if (typeof _flutter !== 'undefined' && _flutter.loader) {
        _flutter.loader.load({
          onEntrypointLoaded: async function(engineInitializer) {
            let appRunner = await engineInitializer.initializeEngine();
            var loading = document.getElementById('loading');
            if (loading) {
              loading.classList.add('fade-out');
              setTimeout(() => loading.remove(), 300);
            }
            await appRunner.runApp();
          }
        });
      }
    });
  </script>
</body>
</html>
