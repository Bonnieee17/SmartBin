<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmartBin Reward System">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SmartBin</title>
  <style>
    body {
      background-color: #f0f4f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #loading {
      text-align: center;
      transition: opacity 0.15s ease-out;
    }
    .fade-out {
      opacity: 0;
    }
  </style>
  <script>
    // Prevent white flash on startup by applying saved theme instantly
    try {
      if (localStorage.getItem('flutter.darkMode') === 'true') {
        document.documentElement.style.backgroundColor = '#121212';
        document.write('<style>body { background-color: #121212 !important; color: #ffffff !important; }</style>');
      }
    } catch(e) {}
  </script>
</head>
<body>
  <div id="loading">
    <img src="favicon.png" style="width: 80px; height: 80px; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); margin-bottom: 14px;">
    <div style="color: #2e7d32; font-family: sans-serif; font-weight: bold; letter-spacing: 2px; font-size: 13px;">SMARTBIN</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function(ev) {
      if (typeof _flutter !== 'undefined' && _flutter.loader) {
        _flutter.loader.load({
          onEntrypointLoaded: async function(engineInitializer) {
            let appRunner = await engineInitializer.initializeEngine();
            var loading = document.getElementById('loading');
            if (loading) {
              loading.classList.add('fade-out');
              setTimeout(() => loading.remove(), 150);
            }
            await appRunner.runApp();
          }
        });
      }
    });
  </script>
</body>
</html>
