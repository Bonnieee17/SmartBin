name: smart_bin
description: "SmartBin Reward System"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.2.0

  # Supabase
  supabase_flutter: ^2.8.0

  # QR Scanner
  mobile_scanner: ^6.0.2

  # Charts
  fl_chart: ^0.66.0

  # Image Picker
  image_picker: ^1.1.2

  # Local Storage
  shared_preferences: ^2.3.2

  # SVG
  flutter_svg: ^2.0.10

  intl: ^0.19.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
